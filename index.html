<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leegal - Income Tax Return Filing</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Leegal</h1>
    <p>Your partner for easy Income Tax Return filing</p>
  </header>
  <main>
    <section>
      <h2>File Your ITR</h2>
      <p>We help individuals and businesses prepare and file their Income Tax Returns quickly and accurately.</p>
    </section>
    <section id="contact">
      <h2>Contact Us</h2>
      <form id="contact-form">
        <label>
          Name
          <input type="text" id="name" required />
        </label>
        <label>
          Email
          <input type="email" id="email" required />
        </label>
        <button type="submit">Send</button>
      </form>
      <p id="status"></p>
    </section>
  </main>
  <footer>
    <small>&copy; 2024 Leegal</small>
  </footer>
  <script src="script.js"></script>
</body>
</html>
